name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Check Lua syntax
        run: find SynastriaCompanion -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Build zip
        id: pkg
        run: |
          python tools/package.py
          version=$(sed -n 's/^## Version: *//p' SynastriaCompanion/SynastriaCompanion.toc | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SynastriaCompanion-${{ steps.pkg.outputs.version }}
          path: dist/*.zip

      - name: Publish a release if the version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; raise ## Version in the .toc to publish a new one."
            exit 0
          fi
          gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --title "Synastria Companion $VERSION" --generate-notes
